name: Unit tests

# Gates PRs on the vitest unit suite. Uses `npx vitest` so it needs no
# devDependency / package-lock change (the tested modules are dependency-free
# pure functions, so no app install is required).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Install vitest into the project's node_modules (not via npx) so that
      # vitest.config.ts can resolve `vitest/config`. --no-save keeps
      # package.json/package-lock.json untouched, so the existing `npm ci`
      # workflows stay in sync (the tested modules are dependency-free, so we
      # don't need the app's full dependency tree).
      - name: Install vitest
        run: npm install --no-save --no-package-lock --ignore-scripts vitest@2
      - name: Run unit tests
        run: npx vitest run
